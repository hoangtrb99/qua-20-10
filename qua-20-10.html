<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Món Quà 20/10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2b0d26; --bg2:#5b1840; --rose:#ff4d85; --pink:#ff8fb3; --gold:#f6c25b;
  --cream:#fffaf4; --ink:#4a2338; --white:#fff;
  --sans:"Be Vietnam Pro",system-ui,sans-serif; --script:"Dancing Script",cursive;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);color:var(--white);
  background:radial-gradient(120% 90% at 50% 10%,#7a2252 0%,var(--bg2) 35%,var(--bg1) 80%);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}

/* ánh sáng bokeh */
.lights span{position:fixed;border-radius:50%;filter:blur(46px);opacity:.5;pointer-events:none;z-index:0;
  animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-60px) scale(1.25)}}
.sky{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity 2s;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 100%,#3b1238 0%,#140a24 55%,#07050f 100%)}
body.night .sky{opacity:1}

#petals{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none}

/* màn hình */
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:14px;
  opacity:0;visibility:hidden;transform:scale(1.04);
  transition:opacity .8s,transform .8s,visibility 0s .8s}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .8s,transform .8s}
.screen.active > *{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.screen.active > *:nth-child(2){animation-delay:.15s}
.screen.active > *:nth-child(3){animation-delay:.3s}
.screen.active > *:nth-child(4){animation-delay:.45s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

.eyebrow{letter-spacing:.5em;font-size:13px;color:var(--gold);opacity:.9}
.script{font-family:var(--script);font-weight:700}
h1{font-size:clamp(38px,10vw,64px);line-height:1.15;text-shadow:0 0 28px rgba(255,170,200,.65)}
.sub{font-weight:300;font-size:16px;opacity:.85;min-height:1.4em}

/* màn 1 */
.choices{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center;margin-top:12px}
.choice{width:min(300px,100%);padding:18px 22px;border-radius:20px;cursor:pointer;
  border:1px solid rgba(255,255,255,.25);color:#fff;font:600 20px var(--sans);
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,.25);transition:transform .35s,box-shadow .35s;-webkit-tap-highlight-color:transparent}
.choice:hover,.choice:focus-visible{transform:translateY(-3px);box-shadow:0 14px 50px rgba(255,140,180,.45);outline:none}
.choice:active{transform:scale(.97)}
.emo{font-size:36px;filter:drop-shadow(0 0 12px rgba(255,180,200,.85))}

/* màn 2 */
.ask{font-size:clamp(26px,7vw,40px);line-height:1.35;max-width:560px;font-weight:600;text-shadow:0 0 24px rgba(255,160,200,.5)}
.btns{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:18px;min-height:70px}
.btn{font:600 18px var(--sans);padding:14px 36px;border-radius:999px;border:0;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#ff7aa2,var(--rose));
  box-shadow:0 10px 30px rgba(255,77,133,.45),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .35s cubic-bezier(.3,1.5,.5,1),opacity .4s;-webkit-tap-highlight-color:transparent}
.yes{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 10px 50px rgba(255,77,133,.85),0 0 0 10px rgba(255,120,170,.12),inset 0 1px 0 rgba(255,255,255,.45)}}
.no{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.no.free{position:fixed;z-index:10;transition:left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1),opacity .4s}

/* màn 3: hộp quà */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px}
.beam{position:absolute;left:50%;top:40%;width:320px;height:320px;border-radius:50%;pointer-events:none;
  transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform 1.4s ease-out,opacity 1.4s;
  background:radial-gradient(circle,rgba(255,236,170,.95) 0%,rgba(255,190,120,.45) 30%,transparent 70%)}
.stage.open .beam{opacity:1;transform:translate(-50%,-50%) scale(3)}
.gift{position:relative;width:180px;height:180px;background:none;border:0;cursor:pointer;
  animation:wiggle 2.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 0 30px rgba(255,120,170,.45))}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}85%{transform:rotate(-4deg)}90%{transform:rotate(3deg)}}
.box{position:absolute;left:12px;right:12px;bottom:0;height:122px;border-radius:12px;
  background:linear-gradient(135deg,#ff86ab,#e23f76);box-shadow:inset 0 -14px 22px rgba(0,0,0,.18),inset 0 8px 14px rgba(255,255,255,.18)}
.box::before,.lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:28px;transform:translateX(-50%);
  background:linear-gradient(90deg,#e8a93e,#ffe7a3,#e8a93e)}
.lid{position:absolute;left:0;right:0;bottom:114px;height:42px;border-radius:9px;z-index:2;
  background:linear-gradient(135deg,#ff9bbb,#f0588a);box-shadow:0 6px 14px rgba(0,0,0,.2);
  transform-origin:15% 100%;transition:transform 1s cubic-bezier(.3,1.5,.5,1),opacity 1s .2s}
.bow{position:absolute;bottom:38px;width:50px;height:36px;border:10px solid var(--gold);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:inset 0 0 6px rgba(0,0,0,.15)}
.bow.l{right:50%;transform:rotate(-20deg);transform-origin:right bottom}
.bow.r{left:50%;transform:rotate(20deg);transform-origin:left bottom}
.gift.open{animation:none}
.gift.open .lid{transform:translate(-40px,-170px) rotate(-38deg);opacity:0}

/* lá thư */
.letter{display:none;position:relative;width:min(440px,100%);max-height:calc(100dvh - 48px);overflow:auto;
  background:linear-gradient(180deg,var(--cream),#fff0ea);color:var(--ink);text-align:left;
  border-radius:20px;padding:16px 20px 22px;
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 70px rgba(255,190,210,.4)}
.letter.show{display:block;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.photos{position:relative;width:100%;height:min(42vh,340px);border-radius:14px;overflow:hidden;margin-bottom:16px;
  background:#f6dfe6;box-shadow:0 8px 24px rgba(160,60,100,.25)}
.ph{position:absolute;inset:0;opacity:0;transition:opacity 1.1s}
.ph.on{opacity:1}
.ph .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.75);transform:scale(1.25)}
.ph .main,.ph .empty{position:relative;width:100%;height:100%;object-fit:contain;transform:scale(1.14);transition:transform 4.5s linear}
.ph.on .main,.ph.on .empty{transform:scale(1)}
.ph .empty{display:flex;align-items:center;justify-content:center;font-size:72px;
  background:linear-gradient(135deg,#ffd6e2,#ffeccf)}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;font-size:14px;color:#fff;
  background:linear-gradient(transparent,rgba(60,10,35,.65))}
.line{font-size:16px;line-height:1.65;margin-bottom:10px;opacity:0;transform:translateY(8px);filter:blur(5px);
  transition:opacity 1s,transform 1s,filter 1s}
.line.on{opacity:1;transform:none;filter:none}
.line.hello{font-family:var(--script);font-size:28px;color:#c2306a}
.line.sign{font-family:var(--script);font-size:24px;text-align:right;color:#c2306a}
.next{display:block;margin:16px auto 0;opacity:0;pointer-events:none}
.next.on{opacity:1;pointer-events:auto;animation:pulse 1.8s ease-in-out infinite}

/* màn 4 */
.title{font-size:clamp(44px,12vw,78px);
  background:linear-gradient(90deg,#ffd27a,#ff9ec0,#fff,#ffd27a);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 0 20px rgba(255,180,200,.7));animation:shine 5s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.ticket{position:relative;width:min(340px,100%);height:176px;margin-top:10px;border-radius:16px;color:var(--ink);
  background:linear-gradient(135deg,#fff7ec,#ffe3ec);
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 14px,#000 15px) left/51% 100% no-repeat,
               radial-gradient(circle at 100% 50%,transparent 14px,#000 15px) right/51% 100% no-repeat;
          mask:radial-gradient(circle at 0 50%,transparent 14px,#000 15px) left/51% 100% no-repeat,
               radial-gradient(circle at 100% 50%,transparent 14px,#000 15px) right/51% 100% no-repeat;
  box-shadow:0 20px 60px rgba(0,0,0,.4)}
.ticket-wrap{filter:drop-shadow(0 0 0 transparent);transition:filter 1s}
.ticket-wrap.won{filter:drop-shadow(0 0 28px rgba(255,210,120,.85))}
.tk-in{position:absolute;inset:10px 24px;border:2px dashed rgba(226,63,118,.35);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;text-align:center}
.tk-label{font-size:12px;letter-spacing:.35em;color:#c2306a;font-weight:600}
.tk-value{font-family:var(--script);font-size:26px;line-height:1.2;color:#8a1f4c}
.tk-note{font-size:12px;opacity:.7}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity .9s}
.tiny{font-size:13px;opacity:.6}

@media (prefers-reduced-motion:reduce){.gift,.yes,.title{animation:none}}
</style>
</head>
<body>

<div class="lights" aria-hidden="true">
  <span style="width:260px;height:260px;left:-60px;top:8%;background:#ff5c9a"></span>
  <span style="width:220px;height:220px;right:-50px;top:30%;background:#ffb347;animation-delay:-5s"></span>
  <span style="width:300px;height:300px;left:20%;bottom:-120px;background:#c84bff;animation-delay:-9s"></span>
  <span style="width:160px;height:160px;right:18%;top:-40px;background:#ffd6e7;animation-delay:-3s"></span>
</div>
<div class="sky"></div>
<canvas id="petals"></canvas>

<!-- MÀN 1: chọn người -->
<section class="screen active" id="s-choose">
  <p class="eyebrow">20 · 10</p>
  <h1 class="script">Hôm nay là một<br>ngày đặc biệt…</h1>
  <p class="sub">Món quà này dành cho ai nhỉ?</p>
  <div class="choices">
    <button class="choice" data-who="me"><span class="emo">🌷</span><span>Dành cho Mẹ</span></button>
    <button class="choice" data-who="chi"><span class="emo">🌸</span><span>Dành cho Chị</span></button>
  </div>
</section>

<!-- MÀN 2: một câu hỏi -->
<section class="screen" id="s-ask">
  <h2 class="ask" id="askText"></h2>
  <div class="btns"><button class="btn yes" id="yes">Có</button><button class="btn no" id="no">Không</button></div>
  <p class="sub" id="askHint"></p>
</section>

<!-- MÀN 3: mở quà -->
<section class="screen" id="s-gift">
  <div class="stage" id="stage">
    <div class="beam"></div>
    <button class="gift" id="gift" aria-label="Mở hộp quà">
      <div class="lid"><span class="bow l"></span><span class="bow r"></span></div>
      <div class="box"></div>
    </button>
    <p class="sub">Chạm vào hộp quà nhé 🎁</p>
  </div>
  <article class="letter" id="letter">
    <div class="photos" id="photos"></div>
    <div id="lines"></div>
    <button class="btn next" id="toEnd">Còn một bất ngờ nữa ✨</button>
  </article>
</section>

<!-- MÀN 4: kết -->
<section class="screen" id="s-end">
  <h1 class="title script">Chúc mừng 20/10</h1>
  <p class="sub" id="endSub"></p>
  <div class="ticket-wrap" id="ticketWrap">
    <div class="ticket" id="ticket">
      <div class="tk-in">
        <p class="tk-label">PHIẾU QUÀ TẶNG</p>
        <p class="tk-value" id="tkValue"></p>
        <p class="tk-note" id="tkNote"></p>
      </div>
      <canvas id="scratch"></canvas>
    </div>
  </div>
  <p class="sub" id="scratchHint">Cào lớp vàng để nhận quà nhé 👆</p>
</section>

<canvas id="fx"></canvas>

<script>
/* ============================================================
   ✏️ CHỈNH NỘI DUNG Ở ĐÂY
   - Ảnh: chép ảnh vào cùng thư mục với file này rồi ghi tên file,
     ví dụ { src: "me1.jpg", cap: "Chuyến Đà Lạt 2023" }.
     Để src rỗng "" thì hiện khung emoji thay ảnh.
   ============================================================ */
const CONFIG = {
  me: {
    self: "con", callLow: "mẹ",
    petals: ["#ff9eb5", "#ffc2d1", "#ff6f91", "#ffe0e8"],
    yesText: "Biết ngay mà! Con thương mẹ nhất 💗",
    letter: [
      "Mẹ yêu của con,",
      "Cảm ơn mẹ vì bao năm tháng tảo tần, vì những bữa cơm ấm và những lời dặn dò chẳng bao giờ thôi.",
      "Con lớn rồi, nhưng trong mắt mẹ con vẫn là đứa trẻ, và con thích điều đó lắm.",
      "Chúc mẹ luôn khỏe, luôn cười, và luôn biết rằng con thương mẹ nhiều hơn những gì con nói ra.",
      "— Con của mẹ"
    ],
    photos: [
      { src: "anh/me1.jpg", cap: "Nụ cười hiền nhất của mẹ" },
      { src: "anh/me2.jpg", cap: "Mẹ đi đâu cũng xinh" },
      { src: "anh/me3.jpg", cap: "Mẹ tung khăn giữa trời mây" },
      { src: "anh/me4.jpg", cap: "Mẹ gan dạ cầm cả tổ ong 🐝" },
      { src: "anh/me5.jpg", cap: "Chuyến đi bên thác nước" },
      { src: "anh/me6.jpg", cap: "Gửi mẹ cả trăm trái tim 💗" },
      { src: "anh/me7.jpg", cap: "Con thương mẹ nhiều lắm 🥺" }
    ],
    endSub: "Gửi mẹ, người phụ nữ tuyệt vời nhất đời con 💐",
    voucher: { value: "Một chuyến đi chơi cùng con, con lo hết!", note: "Hạn dùng: mãi mãi · Đưa phiếu này cho con để đổi" }
  },
  chi: {
    self: "em", callLow: "chị",
    petals: ["#ffb7d5", "#f7c6ff", "#ff8fc7", "#fff0f7"],
    yesText: "Biết ngay mà! Em thương chị nhất 💗",
    letter: [
      "Chị yêu của em,",
      "Cảm ơn chị vì luôn che chở, bày cho em đủ thứ, và cũng là người cãi nhau với em nhiều nhất 😆",
      "Có chị, em thấy mình chẳng bao giờ phải một mình.",
      "Chúc chị luôn xinh, luôn vui, được thương thật nhiều, và nhớ là em luôn đứng về phía chị.",
      "— Đứa em lắm chuyện của chị"
    ],
    photos: [
      { src: "", emoji: "🌸", cap: "Chị xinh nhất nhà" },
      { src: "", emoji: "🧋", cap: "Những buổi trà sữa tám chuyện" },
      { src: "", emoji: "📸", cap: "Hai chị em mình" },
      { src: "", emoji: "✨", cap: "Mãi là chị đại của em" }
    ],
    endSub: "Gửi chị, người chị xinh đẹp và tuyệt vời nhất 💐",
    voucher: { value: "Một buổi shopping, em bao 💳", note: "Hạn dùng: mãi mãi · Đưa phiếu này cho em để đổi" }
  }
};

/* ============================================================ */
const $ = s => document.querySelector(s);
const pick = a => a[Math.random() * a.length | 0];
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let W = innerWidth, H = innerHeight, P = null;

const pc = $('#petals'), px = pc.getContext('2d');
const fx = $('#fx'), fxx = fx.getContext('2d');
function resize() {
  W = innerWidth; H = innerHeight;
  for (const [c, x] of [[pc, px], [fx, fxx]]) {
    c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}
addEventListener('resize', resize); resize();

function go(id) {
  document.querySelector('.screen.active')?.classList.remove('active');
  $('#' + id).classList.add('active');
}

/* ---------- cánh hoa rơi ---------- */
let petalColors = ["#ffb3c7", "#ff8fab", "#ffd1dc", "#ffc4d6"], petalSpeed = 1;
const newPetal = initial => ({
  x: Math.random() * W, y: initial ? Math.random() * H : -20 - Math.random() * 200,
  s: 6 + Math.random() * 9, vy: .5 + Math.random(), vx: -.3 + Math.random() * .6,
  rot: Math.random() * 6.28, vr: (Math.random() - .5) * .04,
  flip: Math.random() * 6.28, vf: .02 + Math.random() * .04, ph: Math.random() * 6.28,
  c: pick(petalColors), a: .5 + Math.random() * .45
});
const petals = Array.from({ length: Math.min(42, Math.round(W * H / 22000) + 18) }, () => newPetal(true));
function drawPetals(t) {
  px.clearRect(0, 0, W, H);
  for (const p of petals) {
    p.y += p.vy * petalSpeed; p.x += p.vx + Math.sin(t / 1000 + p.ph) * .6;
    p.rot += p.vr; p.flip += p.vf;
    if (p.y > H + 30 || p.x < -40 || p.x > W + 40) Object.assign(p, newPetal(false));
    const s = p.s;
    px.save(); px.translate(p.x, p.y); px.rotate(p.rot);
    px.scale(1, Math.abs(Math.cos(p.flip)) * .8 + .2); px.globalAlpha = p.a;
    const g = px.createLinearGradient(0, -s, 0, s);
    g.addColorStop(0, p.c); g.addColorStop(1, '#fff3f7');
    px.fillStyle = g; px.beginPath();
    px.moveTo(0, -s * .7); px.lineTo(-s * .18, -s);
    px.bezierCurveTo(-s, -s * .6, -s * .8, s * .7, 0, s);
    px.bezierCurveTo(s * .8, s * .7, s, -s * .6, s * .18, -s);
    px.closePath(); px.fill(); px.restore();
  }
}

/* ---------- hiệu ứng: tim, hoa giấy, pháo hoa ---------- */
const parts = []; let trails = false;
const HEARTS = ["#ff4d85", "#ff7aa2", "#ffb3c7", "#ff2e63", "#ffd1dc"];
const CONF = ["#ff4d85", "#ffd27a", "#ff9ec0", "#b07cff", "#7ad7ff", "#fff1a8", "#ffffff"];
const FW = ["#ffd27a", "#ff7aa2", "#ffb3e6", "#a98bff", "#7ad7ff", "#fff3d6", "#ff9a6b"];
function add(p) { parts.push(Object.assign({ vx: 0, vy: 0, g: 0, drag: 1, rot: 0, vr: 0, life: 100 }, p, { max: p.life || 100 })); }
function heartPath(c, s) {
  c.beginPath(); c.translate(0, -s * .42);
  c.moveTo(0, s / 4);
  c.bezierCurveTo(0, 0, -s / 2, 0, -s / 2, s / 4);
  c.bezierCurveTo(-s / 2, s / 2, 0, s * .65, 0, s * .85);
  c.bezierCurveTo(0, s * .65, s / 2, s / 2, s / 2, s / 4);
  c.bezierCurveTo(s / 2, 0, 0, 0, 0, s / 4);
}
function hearts(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = 3 + Math.random() * 10;
    add({ kind: 'heart', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, g: -.035, drag: .965,
      life: 150 + Math.random() * 90, size: 12 + Math.random() * 20, rot: (Math.random() - .5) * .6,
      vr: (Math.random() - .5) * .02, color: pick(HEARTS) });
  }
}
function heartRain(ms) {
  const end = performance.now() + ms;
  (function spawn() {
    for (let i = 0; i < 3; i++) add({ kind: 'heart', x: Math.random() * W, y: H + 20, vx: (Math.random() - .5),
      vy: -(2.5 + Math.random() * 3.5), g: -.01, drag: .995, life: 260, size: 10 + Math.random() * 22,
      rot: (Math.random() - .5) * .5, vr: (Math.random() - .5) * .02, color: pick(HEARTS) });
    if (performance.now() < end) setTimeout(spawn, 60);
  })();
}
function confetti(x, y, n, spread = 1) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4 * spread, sp = 6 + Math.random() * 11;
    add({ kind: 'conf', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .22, drag: .982,
      life: 190 + Math.random() * 70, size: 7 + Math.random() * 7, rot: Math.random() * 6,
      vr: (Math.random() - .5) * .3, color: pick(CONF) });
  }
}
function sparkles(x, y, n, colors = ["#ffe9a8", "#fff", "#ffd27a"]) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, sp = 1 + Math.random() * 6;
    add({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: .03, drag: .96,
      life: 50 + Math.random() * 50, size: 1.4 + Math.random() * 1.8, color: pick(colors) });
  }
}
function explode(r) {
  const n = 80, c1 = pick(FW), c2 = pick(FW), heart = Math.random() < .3;
  for (let i = 0; i < n; i++) {
    const t = i / n * 6.283; let vx, vy;
    if (heart) {
      vx = 16 * Math.sin(t) ** 3 * .3;
      vy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * .3;
    } else { const sp = 2 + Math.random() * 4.5; vx = Math.cos(t) * sp; vy = Math.sin(t) * sp; }
    add({ kind: 'spark', x: r.x, y: r.y, vx, vy, g: .035, drag: .975,
      life: heart ? 95 : 70 + Math.random() * 45, size: 1.6 + Math.random() * 1.2, color: i % 3 ? c1 : c2 });
  }
}
function launch(x = W * (.15 + Math.random() * .7), ty = H * (.1 + Math.random() * .3)) {
  const g = .12;
  add({ kind: 'rocket', x, y: H + 5, vx: (Math.random() - .5) * 1.2, vy: -Math.sqrt(2 * g * (H - ty)),
    g, life: 600, size: 2.2, color: '#fff3d6', ty });
}

function drawPart(p) {
  const al = Math.min(1, p.life / p.max * 1.6);
  if (p.kind === 'spark' || p.kind === 'rocket') {
    fxx.globalCompositeOperation = 'lighter'; fxx.fillStyle = p.color;
    fxx.globalAlpha = al; fxx.beginPath(); fxx.arc(p.x, p.y, p.size, 0, 6.283); fxx.fill();
    fxx.globalAlpha = al * .16; fxx.beginPath(); fxx.arc(p.x, p.y, p.size * 3.2, 0, 6.283); fxx.fill();
    return;
  }
  fxx.globalCompositeOperation = 'source-over'; fxx.globalAlpha = al;
  fxx.save(); fxx.translate(p.x, p.y); fxx.rotate(p.rot); fxx.fillStyle = p.color;
  if (p.kind === 'heart') { heartPath(fxx, p.size); fxx.fill(); }
  else { fxx.scale(1, Math.cos(p.rot * 3)); fxx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
  fxx.restore();
}
function frame(t) {
  drawPetals(t);
  if (trails) {
    fxx.globalCompositeOperation = 'destination-out'; fxx.globalAlpha = 1;
    fxx.fillStyle = 'rgba(0,0,0,.24)'; fxx.fillRect(0, 0, W, H);
  } else fxx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vx *= p.drag; p.vy *= p.drag; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    if (p.kind === 'rocket') {
      add({ kind: 'spark', x: p.x, y: p.y, vx: (Math.random() - .5) * .6, vy: 1, life: 18, size: 1.2, color: '#ffd27a' });
      if (p.vy >= -1.2 || p.y <= p.ty) { explode(p); p.life = 0; }
    }
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    drawPart(p);
  }
  fxx.globalAlpha = 1; fxx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const center = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

/* ---------- MÀN 1 ---------- */
document.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
  if (P) return;
  P = CONFIG[b.dataset.who];
  P.photos.forEach(ph => { if (ph.src) new Image().src = ph.src; });
  petalColors = P.petals; petals.forEach(p => p.c = pick(petalColors));
  const c = center(b); sparkles(c.x, c.y, 40, [...P.petals, '#fff']);
  $('#askText').textContent = `Có biết ${P.self} thương ${P.callLow} nhiều lắm không?`;
  setTimeout(() => go('s-ask'), 500);
}));

/* ---------- MÀN 2 ---------- */
const yes = $('#yes'), no = $('#no');
const NO_TXT = ["Không", "Chắc chưa? 🤨", "Bấm lộn rồi 😝", "Hông có nút này đâu", "Thôi mà~", "Bấm “Có” đi mà 🥺"];
const HINTS = ["", "Ơ, nút chạy mất rồi 😆", "Nút đó hỏng rồi đó", "Chỉ còn một đáp án thôi", "Nút “Có” to lắm rồi kìa 👉"];
let escapes = 0, answered = false;
function flee(e) {
  if (e) e.preventDefault();
  if (answered) return;
  const r = no.getBoundingClientRect();
  if (!no.classList.contains('free')) {
    no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
    no.classList.add('free'); no.offsetWidth;
  }
  escapes++;
  no.textContent = NO_TXT[Math.min(escapes, NO_TXT.length - 1)];
  $('#askHint').textContent = HINTS[Math.min(escapes, HINTS.length - 1)];
  yes.style.transform = `scale(${Math.min(1 + escapes * .12, 1.7)})`;
  const yc = center(yes), w = no.offsetWidth, h = no.offsetHeight;
  let nx, ny, tries = 0;
  do {
    nx = 16 + Math.random() * Math.max(0, W - w - 32);
    ny = 16 + Math.random() * Math.max(0, H - h - 32);
  } while (++tries < 25 && Math.hypot(nx + w / 2 - yc.x, ny + h / 2 - yc.y) < 150);
  no.style.left = nx + 'px'; no.style.top = ny + 'px';
}
no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') flee(); });
no.addEventListener('pointerdown', flee);
no.addEventListener('click', flee);

yes.addEventListener('click', () => {
  if (answered) return; answered = true;
  const c = center(yes);
  hearts(c.x, c.y, 100); heartRain(2000);
  no.style.opacity = 0; no.style.pointerEvents = 'none';
  $('#askText').textContent = P.yesText; $('#askHint').textContent = '';
  setTimeout(() => go('s-gift'), 2800);
});

/* ---------- MÀN 3 ---------- */
let opened = false, slideTimer = null;
$('#gift').addEventListener('click', () => {
  if (opened) return; opened = true;
  const g = $('#gift'), c = center(g);
  g.classList.add('open'); $('#stage').classList.add('open');
  setTimeout(() => { confetti(c.x, c.y - 30, 160); sparkles(c.x, c.y - 40, 70); }, 220);
  setTimeout(() => { $('#stage').style.display = 'none'; showLetter(); }, 1500);
});

function photoSlide(ph, i) {
  const fig = document.createElement('figure'); fig.className = 'ph' + (i ? '' : ' on');
  const empty = () => { const d = document.createElement('div'); d.className = 'empty'; d.textContent = ph.emoji || '💗'; return d; };
  if (ph.src) {
    const bg = new Image(); bg.src = ph.src; bg.className = 'bg'; bg.alt = '';
    const img = new Image(); img.src = ph.src; img.className = 'main'; img.alt = ph.cap || '';
    img.onerror = () => { bg.remove(); img.replaceWith(empty()); };
    fig.append(bg, img);
  } else fig.append(empty());
  if (ph.cap) { const cap = document.createElement('figcaption'); cap.textContent = ph.cap; fig.append(cap); }
  return fig;
}
function showLetter() {
  const photos = $('#photos'), lines = $('#lines');
  P.photos.forEach((ph, i) => photos.append(photoSlide(ph, i)));
  const slides = [...photos.children]; let cur = 0;
  if (slides.length > 1) slideTimer = setInterval(() => {
    slides[cur].classList.remove('on'); cur = (cur + 1) % slides.length; slides[cur].classList.add('on');
  }, 2800);
  P.letter.forEach((txt, i) => {
    const p = document.createElement('p');
    p.className = 'line' + (i === 0 ? ' hello' : i === P.letter.length - 1 ? ' sign' : '');
    p.textContent = txt; lines.append(p);
    setTimeout(() => p.classList.add('on'), 700 + i * 1700);
  });
  $('#letter').classList.add('show');
  setTimeout(() => $('#toEnd').classList.add('on'), 700 + P.letter.length * 1700);
}

/* ---------- MÀN 4 ---------- */
let fwTimer = null;
$('#toEnd').addEventListener('click', () => {
  clearInterval(slideTimer);
  $('#endSub').textContent = P.endSub;
  $('#tkValue').textContent = P.voucher.value;
  $('#tkNote').textContent = P.voucher.note;
  document.body.classList.add('night'); petalSpeed = .6; trails = true;
  go('s-end');
  requestAnimationFrame(initScratch);
  [0, 300, 650, 1000, 1400].forEach(d => setTimeout(() => launch(), d));
  fwTimer = setInterval(() => { launch(); if (Math.random() < .4) setTimeout(() => launch(), 250); }, 1100);
});
$('#s-end').addEventListener('pointerdown', e => {
  if (e.target.closest('#ticket')) return;
  explode({ x: e.clientX, y: e.clientY });
});

function initScratch() {
  const c = $('#scratch'), w = c.offsetWidth, h = c.offsetHeight, x = c.getContext('2d');
  c.width = w * dpr; c.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#cf9a3c'); g.addColorStop(.45, '#ffeab0'); g.addColorStop(.55, '#f7d27e'); g.addColorStop(1, '#bf8a2c');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * .55})`; x.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6); }
  x.fillStyle = 'rgba(105,62,8,.8)'; x.font = '600 18px "Be Vietnam Pro", sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('✨ Cào ở đây ✨', w / 2, h / 2);

  x.globalCompositeOperation = 'destination-out';
  x.fillStyle = x.strokeStyle = '#000'; x.lineCap = x.lineJoin = 'round'; x.lineWidth = 38;
  let down = false, last = null, moves = 0, done = false;
  const pt = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.addEventListener('pointerdown', e => {
    if (done) return; down = true; c.setPointerCapture(e.pointerId);
    last = pt(e); x.beginPath(); x.arc(last.x, last.y, 19, 0, 6.283); x.fill();
  });
  c.addEventListener('pointermove', e => {
    if (!down || done) return;
    const p = pt(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(p.x, p.y); x.stroke(); last = p;
    if (Math.random() < .25) sparkles(e.clientX, e.clientY, 2);
    if (++moves % 6 === 0) check();
  });
  const up = () => { down = false; check(); };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  function check() {
    if (done) return;
    const d = x.getImageData(0, 0, c.width, c.height).data; let clear = 0, tot = 0;
    for (let i = 3; i < d.length; i += 160) { tot++; if (d[i] === 0) clear++; }
    if (clear / tot > .5) { done = true; reveal(); }
  }
}
function reveal() {
  $('#scratch').style.opacity = 0; $('#scratch').style.pointerEvents = 'none';
  $('#ticketWrap').classList.add('won');
  const c = center($('#ticket'));
  confetti(c.x, c.y, 140, 1.3); hearts(c.x, c.y, 40); sparkles(c.x, c.y, 60);
  [200, 500, 800].forEach(d => setTimeout(() => launch(), d));
  $('#scratchHint').innerHTML = 'Quà thật đó, nhớ đổi nhé! 💝<br><span class="tiny">Chạm lên bầu trời để bắn thêm pháo hoa</span>';
}
</script>
